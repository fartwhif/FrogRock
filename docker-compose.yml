services:
  frogrock:
    build: .
    container_name: frogrock
    env_file: .env
    ports:
      - "38721:8090"
    volumes:
      - "${HOST_CACHE_DIR}:/cache"
      - /mnt/e/projects/grabbytube/grabby-tracks.json:/grabby-tracks.json:ro
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
