# Shoutcast DNAS dual-mode listener (stream context)
# deploys to /etc/nginx/stream-dnas.conf on gthost, included from the
# `stream {}` block appended to /etc/nginx/nginx.conf.
#
# Why: DNAS itself only serves plain HTTP (it intentionally aborts TLS
# listener handshakes), and YP stores the registration as
# http://<publicip>:<publicport><streampath> — no scheme knob exists.
# But browsers (Chrome, default behavior since ~2025) auto-upgrade http
# stream subresources on https pages to https, and HSTS (frogrock.esfbc.com
# sends includeSubDomains) does the same for any browser that has visited
# the site. Raw-IP stream URLs can never survive that, which is why the
# directory.shoutcast.com web player refused to play the station.
#
# Fix: the YP-registered URL is http://frogrock.esfbc.com:8000/radio, and
# port 8000 answers BOTH plain HTTP (YP reachability tester, Winamp,
# Shoutcast mobile app, saved playlists) and TLS (browsers that upgrade),
# with the valid frogrock.esfbc.com LE certificate.
#
# ssl_preread sniffs the first bytes of each connection:
#   TLS ClientHello -> 127.0.0.1:8443 (TLS-terminating proxy, LE cert)
#   anything else   -> 127.0.0.1:8101 (plain HTTP proxy)
# Both backends live in /etc/nginx/conf.d/frogrock-dnas.conf and proxy to
# the DNAS container over WireGuard (192.168.0.241:8100).
# PROXY protocol carries the real client IP through this extra hop so
# DNAS's listener list / banfile keep seeing real addresses.
#
# Routing: $ssl_preread_protocol is non-empty iff a TLS ClientHello was
# preread. On RHEL10 nginx 1.26.3 (nginx-mod-stream) the exact version
# string does NOT match literal map keys (TLSv1_3 et al. never matched;
# verified empirically), so route on "any non-empty value" — a plain
# HTTP connection always yields the empty string and hits `default`.
map $ssl_preread_protocol $dnas_backend {
    default     127.0.0.1:8101;
    ~.          127.0.0.1:8443;
}
server {
    listen 8000;
    listen [::]:8000;
    ssl_preread on;
    proxy_pass $dnas_backend;
    proxy_protocol on;
    proxy_connect_timeout 5s;
    proxy_timeout 1h;
}
