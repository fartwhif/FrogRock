# Shoutcast DNAS (this machine via WireGuard) — backends for the dual-mode
# :8000 listener. Stream front: /etc/nginx/stream-dnas.conf (see
# dnas/gthost-dnas-stream.conf).
#
#   127.0.0.1:8101  plain HTTP <- stream :8000 non-TLS
#                   (YP reachability tester, Winamp, Shoutcast mobile app)
#   127.0.0.1:8443  TLS        <- stream :8000 TLS (browsers auto-upgrade
#                   http->https; HSTS does the same for browsers that have
#                   visited frogrock.esfbc.com)
#
# Streaming style mirrors the existing /stream.mp3 location in
# gthost's frogrock.esfbc.com.conf
server {
    # proxy_protocol: the stream front carries the real client IP
    listen 127.0.0.1:8101 proxy_protocol;
    listen [::1]:8101 proxy_protocol;
    server_name _;
    location / {
        proxy_pass http://192.168.0.241:8100;
        # Match upstream: DNAS answers with Connection: close
        proxy_set_header Connection 'close';
        # CRITICAL: disable all buffering for streaming audio
        proxy_buffering off;
        # Disable gzip - would corrupt byte-aligned ICY metadata
        proxy_set_header Accept-Encoding '';
        # Prevent nginx from adding Transfer-Encoding: chunked
        chunked_transfer_encoding off;
        # Pass real client info (DNAS 2.4.7+ honors front-facing services)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        # Pass through ALL ICY/Shoutcast headers
        proxy_pass_header icy-name;
        proxy_pass_header icy-description;
        proxy_pass_header icy-genre;
        proxy_pass_header icy-pub;
        proxy_pass_header icy-br;
        proxy_pass_header icy-metaint;
    }
}
server {
    listen 127.0.0.1:8443 ssl proxy_protocol;
    listen [::1]:8443 ssl proxy_protocol;
    server_name frogrock.esfbc.com;
    ssl_certificate     /etc/letsencrypt/live/frogrock.esfbc.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/frogrock.esfbc.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    location / {
        proxy_pass http://192.168.0.241:8100;
        # Match upstream: DNAS answers with Connection: close
        proxy_set_header Connection 'close';
        # CRITICAL: disable all buffering for streaming audio
        proxy_buffering off;
        # Disable gzip - would corrupt byte-aligned ICY metadata
        proxy_set_header Accept-Encoding '';
        # Prevent nginx from adding Transfer-Encoding: chunked
        chunked_transfer_encoding off;
        # Pass real client info (DNAS 2.4.7+ honors front-facing services)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        # Pass through ALL ICY/Shoutcast headers
        proxy_pass_header icy-name;
        proxy_pass_header icy-description;
        proxy_pass_header icy-genre;
        proxy_pass_header icy-pub;
        proxy_pass_header icy-br;
        proxy_pass_header icy-metaint;
    }
}
